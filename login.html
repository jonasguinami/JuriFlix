<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | JuriFlix</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="login.css">
</head>
<body>

    <div class="login-container">
        <div class="login-box">
            <h1 class="logo">JuriFlix</h1>
            <p class="subtitle">Acesse sua biblioteca jurídica definitiva.</p>

            <form id="login-form">
                <div class="input-group">
                    <label for="username">Usuário</label>
                    <input type="text" id="username" name="username" required>
                </div>

                <div class="input-group">
                    <label for="password">Senha</label>
                    <input type="password" id="password" name="password" required>
                </div>

                <button type="submit" class="login-btn">Entrar</button>

                <p id="error-message" class="error-message"></p>
            </form>
            
            <div class="register-link">
                <p>Não tem uma conta? <a href="https://www.instagram.com/juriflixbiblio" target="_blank" rel="noopener noreferrer">Registre-se</a></p>
    </div>

    <script src="login.js"></script>
</body>
</html>
